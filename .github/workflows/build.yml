name: Build & Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # publish logs to the ci-results branch and create releases

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          xcodebuild -version | tee toolchain.log
          swift --version | tee -a toolchain.log
          sw_vers | tee -a toolchain.log

      - name: Cache VLC engine (VLCKit)
        id: vlccache
        uses: actions/cache@v4
        with:
          path: Vendor/VLCKit.xcframework
          key: vlckit-3-v1

      - name: Fetch VLC engine (VLCKit, LGPL-2.1)
        if: steps.vlccache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p Vendor /tmp/vlc && cd /tmp/vlc
          BASE=https://download.videolan.org/pub/cocoapods/prod
          FILE=$(curl -fsSL "$BASE/" | grep -oE 'VLCKit-3\.[0-9.]+-[0-9a-f]+-[0-9a-f]+\.tar\.xz' | sort -uV | tail -1)
          echo "VLCKit archive: $FILE" | tee $GITHUB_WORKSPACE/vlc.log
          curl -fsSL -o vlc.tar.xz "$BASE/$FILE"
          tar xf vlc.tar.xz
          find . -maxdepth 4 \( -name "*.xcframework" -o -name "VLCKit.framework" \) | tee -a $GITHUB_WORKSPACE/vlc.log
          XC=$(find . -maxdepth 4 -name "VLCKit.xcframework" | head -1)
          if [ -n "$XC" ]; then
            cp -R "$XC" $GITHUB_WORKSPACE/Vendor/VLCKit.xcframework
          else
            FW=$(find . -maxdepth 4 -name "VLCKit.framework" | head -1)
            xcodebuild -create-xcframework -framework "$FW" -output $GITHUB_WORKSPACE/Vendor/VLCKit.xcframework
          fi
          cd $GITHUB_WORKSPACE
          find Vendor/VLCKit.xcframework -maxdepth 2 | tee -a vlc.log
          BIN=$(find Vendor/VLCKit.xcframework -path "*macos*" -name VLCKit -type f | head -1)
          [ -n "$BIN" ] && lipo -info "$BIN" | tee -a vlc.log
          ls Vendor/VLCKit.xcframework/*/VLCKit.framework/Modules 2>/dev/null | tee -a vlc.log
          du -sh Vendor/VLCKit.xcframework | tee -a vlc.log

      - name: Build (debug)
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          swift build 2>&1 | tee build.log

      - name: Test
        id: test
        continue-on-error: true
        run: |
          set -o pipefail
          swift test 2>&1 | tee test.log

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/workflows/build.yml

      - name: Cache calibration faces (LFW)
        uses: actions/cache@v4
        with:
          path: ~/scikit_learn_data
          key: lfw-v1

      - name: Calibration photo sample (LFW, CI only — never shipped)
        continue-on-error: true
        run: |
          pip install "numpy<2" scikit-learn pillow 2>&1 | tail -1
          python tools/lfw_sample.py build/lfw 12 8 2>&1 | tee lfw.log

      - name: Restore converted models
        id: modelcache
        uses: actions/cache/restore@v4
        with:
          path: Resources/Models
          key: coreml-models-v4-${{ hashFiles('tools/convert_*.py') }}

      - name: Prepare models (SFace, FSRCNN, Real-ESRGAN → Core ML)
        id: models
        if: steps.modelcache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          pip install "numpy<2" "torch==2.4.1" "coremltools==8.1" onnx onnx2torch onnxruntime 2>&1 | tail -2
          # FSRCNN needs TensorFlow, whose dependencies conflict with ONNX: separate environment.
          python -m venv /tmp/tfenv
          /tmp/tfenv/bin/pip install "numpy<2" "torch==2.4.1" "coremltools==8.1" "tensorflow==2.16.2" scikit-learn pillow 2>&1 | tail -2
          mkdir -p Resources/Models
          ok=0
          python tools/convert_sface.py build/models > sface.log 2>&1 \
            && xcrun coremlcompiler compile build/models/SFace.mlpackage Resources/Models >> sface.log 2>&1 || ok=1
          /tmp/tfenv/bin/python tools/convert_fsrcnn.py build/sr > srmodel.log 2>&1 \
            && for s in 2 3 4; do xcrun coremlcompiler compile build/sr/SR_x$s.mlpackage Resources/Models >> srmodel.log 2>&1; done || ok=1
          python tools/convert_realesrgan.py build/models > esrgan.log 2>&1 \
            && xcrun coremlcompiler compile build/models/RealESRGANx4v3.mlpackage Resources/Models >> esrgan.log 2>&1 || ok=1
          ls -la Resources/Models | tee models.log
          tail -5 sface.log srmodel.log esrgan.log
          exit $ok

      - name: Save converted models (only when every conversion succeeded)
        if: steps.models.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: Resources/Models
          key: coreml-models-v4-${{ hashFiles('tools/convert_*.py') }}

      - name: Package app
        id: package
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          scripts/package_app.sh 2>&1 | tee package.log

      - name: Self-test packaged app
        id: selftest
        if: steps.package.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          APP=dist/PhotoForge.app/Contents/MacOS/PhotoForge
          "$APP" --selftest 2>&1 | tee selftest.log
          # Intel slice via Rosetta, when the runner has it.
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "== x86_64 slice (Rosetta)" | tee -a selftest.log
            arch -x86_64 "$APP" --selftest 2>&1 | tee -a selftest.log
          else
            echo "Rosetta not available on this runner; x86_64 slice not executed" | tee -a selftest.log
          fi

      - name: Face calibration
        id: facecal
        if: steps.package.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          cat lfw.log > facecal.log
          dist/PhotoForge.app/Contents/MacOS/PhotoForge --facecal build/lfw 2>&1 | grep -v "FBBA\|IOService" | tee -a facecal.log
          echo "" | tee -a facecal.log
          python -c "from sklearn.datasets import load_sample_images as l; from PIL import Image; import os; os.makedirs('build/srbench', exist_ok=True); [Image.fromarray(a).save(f'build/srbench/sample{i}.png') for i, a in enumerate(l().images)]"
          cp -R build/lfw/* build/srbench/ 2>/dev/null || true
          dist/PhotoForge.app/Contents/MacOS/PhotoForge --srbench build/srbench 2>&1 | grep -v "FBBA\|IOService" | tee srbench.log

      - name: Publish logs to ci-results branch
        if: always()
        run: |
          mkdir -p /tmp/results
          cp *.log /tmp/results/ 2>/dev/null || true
          {
            echo "commit: ${GITHUB_SHA}"
            echo "build: ${{ steps.build.outcome }}"
            echo "test: ${{ steps.test.outcome }}"
            echo "package: ${{ steps.package.outcome }}"
            echo "selftest: ${{ steps.selftest.outcome }}"
            echo "vlckit: $( [ -d Vendor/VLCKit.xcframework ] && echo present || echo missing ) (cache hit: ${{ steps.vlccache.outputs.cache-hit }})"
            echo "models: ${{ steps.models.outcome }} (cache hit: ${{ steps.modelcache.outputs.cache-hit }})"
            echo "facecal: ${{ steps.facecal.outcome }}"
            echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > /tmp/results/summary.txt
          # Keep only compiler diagnostics for quick reading.
          grep -E "error:|warning: .*(Sendable|concurrency|actor)" /tmp/results/build.log | sort -u > /tmp/results/errors.txt || true
          grep -E "error:" /tmp/results/package.log 2>/dev/null | sort -u >> /tmp/results/errors.txt || true
          grep -E "error:|✘|failed|recorded an issue" /tmp/results/test.log | sort -u > /tmp/results/test-failures.txt || true
          cd /tmp/results
          git init -q -b ci-results
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git add -A; git commit -qm "CI results for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-results

      - name: Upload app artifact
        if: steps.package.outcome == 'success' && hashFiles('dist/*.zip') != ''
        uses: actions/upload-artifact@v4
        with:
          name: PhotoForge-app
          path: dist/*.zip

      - name: Publish release
        if: steps.package.outcome == 'success' && steps.test.outcome == 'success' && steps.selftest.outcome == 'success' && hashFiles('dist/*.zip') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/*.zip --title "PhotoForge build ${GITHUB_RUN_NUMBER}" \
            --notes "Automated build of ${GITHUB_SHA}. Universal (Intel + Apple Silicon). First launch: right-click the app → Open." --latest

      - name: Fail job if build or tests failed
        if: steps.build.outcome != 'success' || steps.test.outcome != 'success' || steps.selftest.outcome != 'success'
        run: exit 1
